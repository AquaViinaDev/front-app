# Сборка для третьего сайта copy.aquaviina.md — точной копии живого, где пробуем правки (28.10.2026).
# Ветка copy → образ ghcr.io/aquaviinadev/front-app:copy-<коммит> и copy-latest.
# Боевые образы из этой ветки не собираются.
name: image-copy

on:
  push:
    branches: [copy]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: short sha
        run: echo "SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://copy.aquaviina.md/api
            API_INTERNAL_URL=http://server:3000
            NEXT_PUBLIC_MEDIA_URL=https://copy.aquaviina.md
            NEXT_PUBLIC_DEFAULT_LOCALE=ru
          tags: |
            ghcr.io/aquaviinadev/front-app:copy-${{ env.SHA }}
            ghcr.io/aquaviinadev/front-app:copy-latest
          cache-from: type=gha,scope=copy
          cache-to: type=gha,mode=max,scope=redesign
